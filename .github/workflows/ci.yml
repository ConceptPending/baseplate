name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel redundant PR runs, but never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (with dev deps)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app/ tests/
      - name: Tests
        run: PYTHONPATH=. pytest -q
      - name: Portability contract
        run: python scripts/check_portability.py

  test-frontend:
    name: Frontend — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build

  api-types:
    name: API types — generated client in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (for the OpenAPI dump)
        run: pip install -e ".[dev]"
        working-directory: backend
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Regenerate the client from the backend OpenAPI spec
        run: make generate-client
      - name: Fail if the committed client is stale
        run: |
          git diff --exit-code frontend/src/lib/api-types.ts \
            || (echo "::error::frontend/src/lib/api-types.ts is stale — change a backend schema? run 'make generate-client' and commit." && exit 1)

  migrations:
    # The local test suite runs on SQLite via create_all (conftest.py) and never
    # executes the Alembic migrations — so nothing else proves they apply. This
    # job is the only place the real migration path runs against real Postgres.
    name: Migrations — apply cleanly to Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myapp
          POSTGRES_PASSWORD: myapp
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://myapp:myapp@localhost:5432/myapp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (with dev deps)
        run: pip install -e ".[dev]"
      - name: Apply every migration to an empty database
        run: PYTHONPATH=. alembic upgrade head
      - name: Models match migrations (catches a forgotten autogenerate)
        # Must run after `upgrade head`: alembic check compares the models to the
        # now-migrated DB and fails if a model changed without a new migration.
        run: PYTHONPATH=. alembic check
